[package]
name = "readr-core"
description = "Reading sessions, shelf, config and reader adapters for readr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.38", features = ["serde"] }
plist = "1.10.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
