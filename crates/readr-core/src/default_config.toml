daily_goal_minutes = 20
count_off_shelf = false
library_dirs = ["~/Documents/Books"]

[remind]
interval = "2h"
start = "09:00"

[nightly]
at = "21:00"
# email_to = "you@example.com"
# smtp_user = "you@gmail.com"
# smtp_host = "smtp.gmail.com"
# smtp_port = 587

[tracking]
poll_seconds = 15
max_page_minutes = 5
last_page_minutes = 1
away_minutes = 15
min_session_seconds = 60
window_focus = true

[launch]
terminal = "rio"

[notify]
# system: macOS Notification Center via terminal-notifier (brew install terminal-notifier),
#         falling back to osascript, where notifications show as "Script Editor"
# herdr:  herdr notification, following herdr's own toast setting; falls back to system
channel = "system"

# folders: folder names under library_dirs whose books are suggested for the goal
# books_collections: Apple Books collections whose books are suggested for the goal

[[goal]]
key = "health"
label = "Health"
color = "green"
folders = ["health"]
books_collections = ["Health"]

[[goal]]
key = "learning"
label = "Learning"
color = "yellow"
folders = ["learning"]
books_collections = ["Learning"]

[[goal]]
key = "communication"
label = "Communication"
color = "blue"
folders = ["communication"]
books_collections = ["Communication"]

[[goal]]
key = "competence"
label = "Circle of competence"
color = "magenta"
folders = ["work"]
books_collections = ["Competence"]
